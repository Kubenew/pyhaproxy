[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhaproxy"
version = "0.1.1"
description = "HAProxy-like L7 load balancer and reverse proxy in pure Python (async)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kubenew"}]
keywords = ["haproxy", "reverse-proxy", "load-balancer", "asyncio", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "starlette>=0.37.2",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27.0",
]
dev = ["pyhaproxy[test]", "ruff>=0.1"]

[project.scripts]
pyhaproxy = "pyhaproxy.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
